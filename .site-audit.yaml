domain: firecraw.com
site_name: Firecraw Tools

site_type:
  - affiliate-content-site

primary_topics:
  - web data tools
  - Firecrawl workflows
  - URL to Markdown
  - web crawling and extraction

target_audience:
  - developers
  - AI agent builders
  - teams evaluating web data APIs

business_goals:
  - Organic traffic
  - Affiliate conversion

primary_entities:
  - Firecraw Tools
  - Firecrawl
  - web data utilities

content_angles:
  - Real task testing
  - Operator experience
  - Step-by-step workflows

unique_evidence:
  - Working local URL and Markdown tools
  - Rendered route and API smoke tests
  - Explicit tool limits and independent-site disclosure

preferred_page_types:
  - review
  - pricing
  - alternative
  - tutorial
  - tool

avoid_topics:
  - Firecrawl official blog topics that are not implemented here

avoid_overlap_with:
  - firecrawl.dev official product pages

keyword_density:
  mode: observation_only
  target: 2%-3%

publishing_thresholds:
  article_score: 85
  site_score: 85
  citation_score: 75

citation:
  enabled: true
  minimum_blocks: 5
  # true | false | unknown; this is declared configuration, not crawler detection.
  indexnow_enabled: unknown
  official_source_domains:
    - firecrawl.dev
    - docs.firecrawl.dev
  prompt_clusters:
    - path: /firecrawl-pricing
      primary_query: What does Firecrawl pricing cost?
      prompts:
        - Is Firecrawl free?
        - How many Firecrawl credits do I need?
    - path: /firecrawl-api
      primary_query: How does the Firecrawl API work?
      prompts:
        - How do I scrape one URL with Firecrawl?
        - When should I use Firecrawl crawl or extraction?
    - path: /firecrawl-mcp
      primary_query: What is Firecrawl MCP?
      prompts:
        - How do I connect Firecrawl MCP to an AI agent?
        - What is the Firecrawl MCP server URL?

audit:
  # audit_only | low_risk_fixes | continuous
  mode: audit_only
  periods:
    - 7
    - 14
    - 28
  core_business: Affiliate content and product evaluation
  target_region:
    - United States
  primary_conversion: Affiliate outbound click
  available_data: []
  priority_paths: []
  site_size: unknown
  permissions:
    online_access: true
    code_read: true
    analytics_read: false
    code_write: false
    production_publish: false
    conversion_data: false

crawl:
  max_pages: 100
  exclude_patterns:
    - "/api/"
    - "/search"

# Optional explicit overrides reduce heuristic ambiguity.
page_overrides:
  - path: /
    page_type: tool-hub
    primary_keyword: firecrawl
    search_intent: brand and tool discovery
    should_index: true
